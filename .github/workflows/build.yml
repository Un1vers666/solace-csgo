name: Build Solace DLL

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install D3DX9 via NuGet
      run: |
        nuget install Microsoft.DXSDK.D3DX -Version 9.29.952.8 -OutputDirectory dxsdk
        $pkg = (Get-ChildItem -Path dxsdk -Filter "Microsoft.DXSDK.D3DX*" | Select-Object -First 1).FullName
        $inc = "$pkg\build\native\include"
        $lib = "$pkg\build\native\release\lib\x86"
        $env:INCLUDE = "$inc;$env:INCLUDE"
        $env:LIB = "$lib;$env:LIB"
        echo "INCLUDE=$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "LIB=$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Build Solution
      run: |
        $regSdk = (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Microsoft SDKs\Windows\v10.0" -ErrorAction SilentlyContinue).ProductVersion
        $sdk = "$regSdk.0"
        Write-Host "Registry SDK: $sdk"
        msbuild solace-csgo.sln /p:Configuration=Release /p:Platform=x86 /p:WindowsTargetPlatformVersion=$sdk /p:UseEnv=true

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: solace-dll
        path: Release/*.dll
