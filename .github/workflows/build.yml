name: Build Solace DLL

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install DirectX SDK via NuGet
      run: |
        nuget install Microsoft.DXSDK.D3DX -Version 9.29.952.8 -OutputDirectory packages
        $d3dx = Resolve-Path "packages\Microsoft.DXSDK.D3DX.9.29.952.8\build\native"
        echo "INCLUDE=$d3dx\include;$env:INCLUDE" >> $env:GITHUB_ENV
        echo "LIB=$d3dx\lib\x86;$env:LIB" >> $env:GITHUB_ENV

    - name: Build Solution
      shell: pwsh
      run: |
        $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty Name
        Write-Host "Using Windows SDK: $sdk"
        msbuild solace-csgo.sln /p:Configuration=Release /p:Platform=x86 /p:WindowsTargetPlatformVersion=$sdk /p:PlatformToolset=v143 /p:UseEnv=true

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: solace-csgo-release
        path: Release/*.dll
