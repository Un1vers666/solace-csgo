name: Build Solace DLL

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install DirectX SDK via NuGet
      shell: pwsh
      run: |
        nuget install Microsoft.DXSDK.D3DX -Version 9.29.952.8 -OutputDirectory dxsdk

    - name: Build Solution
      shell: pwsh
      run: |
        $pkg = (Get-ChildItem -Path dxsdk -Filter "Microsoft.DXSDK.D3DX*" | Select-Object -First 1).FullName
        $dxInc = "$pkg\build\native\include"
        $dxLib = "$pkg\build\native\release\lib\x86"

        $winH = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include\*\um\Windows.h" | Sort-Object FullName -Descending | Select-Object -First 1
        $sdk = $winH.Directory.Parent.Name
        Write-Host "Using Windows SDK: $sdk"

        $vcxproj = "solace-csgo\solace-csgo.vcxproj"
        $content = Get-Content $vcxproj -Raw
        $content = $content -replace '<WindowsTargetPlatformVersion>.*?</WindowsTargetPlatformVersion>', "<WindowsTargetPlatformVersion>$sdk</WindowsTargetPlatformVersion>"
        $content = $content -replace '</Project>', "<PropertyGroup><IncludePath>$dxInc;$(IncludePath)</IncludePath><LibraryPath>$dxLib;$(LibraryPath)</LibraryPath></PropertyGroup></Project>"
        Set-Content $vcxproj $content

        msbuild solace-csgo.sln /p:Configuration=Release /p:Platform=x86

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: solace-csgo-release
        path: Release/*.dll
